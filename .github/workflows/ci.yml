name: cicd

on:
  workflow_dispatch:
  push:
    branches: [ 4.0.6 ]
    paths:
      - 'libtransmission/**'
      - 'cli/**'
      - 'daemon/**'
      - 'gtk/**'
      - 'web/**'
      - 'cmake/**'
      - 'third-party/**'
      - 'CMakeLists.txt'
      - 'Dockerfile'

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]

    steps:
      - name: Check Out Repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up QEMU
        if: matrix.platform == 'linux/arm64'
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ccache-cache
          key: ${{ runner.os }}-ccache-${{ matrix.platform }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ matrix.platform }}-

      - name: Inject ccache into docker
        uses: reproducible-containers/buildkit-cache-dance@v3.1.2
        with:
          cache-map: |
            {
              "ccache-cache": "/root/.ccache"
            }
          skip-extraction: ${{ steps.cache.outputs.cache-hit }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          tags: ghcr.io/ivanjx/transmission:${{ github.ref_name }}${{ matrix.platform == 'linux/arm64' && '-arm64' || '' }}
          cache-from: type=gha,scope=transmission-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=transmission-${{ matrix.platform }}
